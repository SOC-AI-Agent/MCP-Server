# MCP-Server — soc-mcp-splunk, Splunk over MCP, for development.
#
# Not deployed. In production the backend talks to Splunk's own MCP Server app
# directly (Backend/docs/splunk-mcp.md), so this pipeline only builds the
# image and runs the tests. The data catalogue, its scripts and the
# export_catalog job moved to the Backend repo (Backend/docs/splunk-catalog.md).
#
# ThreatQ and Confluence are no longer here either: the backend calls them
# directly.

stages:
  - build
  - test

build_image:
  stage: build
  image: docker:latest
  tags:
    - test
  # A shared runner has no Docker daemon of its own, so one is started alongside.
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t soc-mcp-splunk:${CI_COMMIT_SHORT_SHA} ./Splunk
  rules:
    - if: '$CI_COMMIT_BRANCH'

code_test:
  stage: test
  image: python:3.12
  tags:
    - test
  script:
    - pip install -q -r Splunk/requirements.txt
    # Imported, not just compiled. A missing dependency, or a route function
    # shadowing the module it imports, only shows up when the module runs —
    # both have happened in this repo.
    #
    # The connector refuses to start without its bearer token, so a throwaway
    # one is supplied. It reaches nothing: no platform is contacted at import.
    # Both modes, because each validates a different set of settings.
    - |
      set -eu
      export MCP_AUTH_TOKEN=ci SPLUNK_TOKEN=ci SPLUNK_ALLOWED_INDEXES=main
      for mode in live mock; do
        ( cd Splunk && SPLUNK_MODE=$mode python -c "import server" ) || { echo "Splunk ($mode) failed to import"; exit 1; }
        echo "  Splunk ($mode) imports cleanly"
      done
    # What each route does with a body or a token it did not expect. Nothing
    # here contacts a platform; tests/conftest.py supplies its own environment.
    - |
      set -eu
      pip install -q pytest
      python -m pytest tests -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
