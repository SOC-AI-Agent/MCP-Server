# soc-mcp-splunk — Splunk over MCP, for development.
#
# An MCP server shaped like Splunk's own MCP Server app (tools saia_generate_spl
# and splunk_run_query at /services/mcp). In SPLUNK_MODE=mock it answers from a
# fixed set of events; in production the backend points SPLUNK_MCP_URL at
# Splunk's own MCP server instead and this is not deployed. See Splunk/README.md.
#
# ThreatQ and Confluence are not here: the backend calls them directly.
#
#   cp .env.example .env    # MCP_AUTH_TOKEN, same value as Backend/.env
#   docker compose up -d --build
#
# Nothing here is reachable from outside the network. The backend joins
# `soc-network` and addresses it by container name.

services:
  soc-mcp-splunk:
    build:
      context: ./Splunk
    container_name: soc-mcp-splunk
    env_file: [.env]
    volumes:
      # The company CA, when the platform's certificate is signed by one. See
      # SSL_CERT_FILE in .env.example.
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [soc-network]

networks:
  soc-network:
    # Shared by AI-service/Backend/Frontend/MCP-Server's stacks. Created once,
    # outside any one project (`docker network create soc-network`) —
    # external here so this project doesn't believe it owns and can tear
    # down a network the others are still using.
    external: true
    name: soc-network
