# Dependabot opens PRs when a dependency gets a security advisory or a new
# release. Security updates are opened regardless of the schedule below.
#
# `cooldown` holds a version back until it has survived a week in the registry,
# so a hijacked publish is unpublished before it can reach a PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/Splunk"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/Threatq"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/Confluence"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/Splunk"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/Threatq"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/Confluence"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
